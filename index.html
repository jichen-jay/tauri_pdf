<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri</title>
  </head>

  <body>
    <h1>File Processing Application</h1>

    <!-- Counter Section -->
    <h3>Counter: <span id="counter"></span></h3>
    <div>
      <button id="increment-btn">Increment</button>
      <button id="decrement-btn">Decrement</button>
      <button id="reset-btn">Reset</button>
    </div>
    <p>Press Ctrl+R to reload and see the state persist.</p>

    <!-- HTML File Loading Section -->
    <div class="container">
      <h2>Load Local HTML File</h2>
      <input type="file" id="htmlFileInput" accept=".html" />
      <div id="content-container" class="output-box"></div>
    </div>

    <!-- JavaScript -->
    <script lang="ts">
      // Counter functionality
      const incrementBtn = document.querySelector('#increment-btn');
      const decrementBtn = document.querySelector('#decrement-btn');
      const resetBtn = document.querySelector('#reset-btn');
      const counterContainer = document.querySelector('#counter');

      document.addEventListener('DOMContentLoaded', async () => {
        // Simulated Tauri invoke for counter initialization
        let currentCount = 0; // Replace with await invoke('get') if using Tauri
        counterContainer.innerText = currentCount;
        console.log('Counter initialized.');
      });

      incrementBtn.addEventListener('click', async () => {
        let newCount = parseInt(counterContainer.innerText) + 1; // Replace with await invoke('increment')
        counterContainer.innerText = newCount;
      });

      decrementBtn.addEventListener('click', async () => {
        let newCount = parseInt(counterContainer.innerText) - 1; // Replace with await invoke('decrement')
        counterContainer.innerText = newCount;
      });

      resetBtn.addEventListener('click', async () => {
        let newCount = 0; // Replace with await invoke('reset')
        counterContainer.innerText = newCount;
      });

      // HTML file loading functionality
      const htmlFileInput = document.getElementById('htmlFileInput');
      const contentContainer = document.getElementById('content-container');

      htmlFileInput.addEventListener('change', (event) => {
        const input = event.target;
        if (input.files && input.files[0]) {
          const selectedFile = input.files[0];

          // Validate file type
          if (!selectedFile.name.endsWith('.html')) {
            alert("Please upload a valid HTML file.");
            return;
          }

          // Read and display the HTML file
          const reader = new FileReader();
          reader.onload = function (e) {
            contentContainer.innerHTML = e.target.result;
          };
          reader.onerror = function () {
            alert("Failed to read the file.");
          };
          reader.readAsText(selectedFile);
        }
      });
    </script>

    <!-- Styles -->
    <style>
      body {
        font-family: sans-serif;
        padding: 1rem;
        line-height: 1.6;
      }

      .container {
        margin-top: 2rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .output-box {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        border-radius: 4px;
        max-height: 400px;
        overflow-y: auto;
      }

      button {
        cursor: pointer;
        padding: 0.5rem 1rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        margin-top: 0.5rem;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </body>
</html>
